[workspace]
members = ["crates/*", "user", "user/sdk", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.metadata.volt]
plugin_abi = "abi_stable"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
lto = "thin"

# Volt fork of ACP schema 0.11.4: adds `subagent_update` / session messages /
# `clientCapabilities.subagents` without migrating the 0.10 connection SDK to 3.x.
[patch.crates-io]
agent-client-protocol-schema = { path = "vendor/agent-client-protocol-schema" }

