[package]
name = "editor-plugin-api"
build = "build.rs"

[package.edition]
workspace = true

[package.version]
workspace = true

[package.license]
workspace = true

[package.rust-version]
workspace = true

[features]
default = []
# Host/dev crates only. Staged User Library builds leave this off.
test-helpers = []

[dependencies]
abi_stable = "0.11"
libloading = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tree-sitter = "0.26.7"
tree-sitter-language = "0.1.7"

[lib]
path = "src/lib.rs"
name = "editor_plugin_api"
required-features = []
crate-type = ["lib"]
