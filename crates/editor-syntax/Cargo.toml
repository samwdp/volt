[package]
name = "editor-syntax"

[package.edition]
workspace = true

[package.version]
workspace = true

[package.license]
workspace = true

[package.rust-version]
workspace = true

[dependencies]
libloading = "0.8.9"
tree-sitter = "0.26.7"
tree-sitter-language = "0.1.7"

[dependencies.editor-buffer]
path = "../editor-buffer"

[dependencies.editor-path]
path = "../editor-path"

[dev-dependencies]
criterion = "0.5.1"
tree-sitter-html = "0.23.2"
tree-sitter-rust = "0.24.1"

[dev-dependencies.editor-buffer]
path = "../editor-buffer"

[dev-dependencies.editor-path]
path = "../editor-path"

[target."cfg(windows)".dependencies]
find-msvc-tools = "0.1.9"

[target."cfg(windows)".dev-dependencies]

[target."cfg(windows)".build-dependencies]

[[test]]
path = "tests/corpus_inventory.rs"
name = "corpus_inventory"
required-features = []

[[test]]
path = "tests/registered_queries.rs"
name = "registered_queries"
required-features = []

[lib]
path = "src/lib.rs"
name = "editor_syntax"
required-features = []
crate-type = ["lib"]

[[bench]]
name = "highlight"
harness = false
